<header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-2">
    <span class="text-2xl">🍲</span>
    <div>
      <h1 class="font-black text-sm text-slate-800 leading-none">MILOR</h1>
      <span class="text-[10px] text-red-500 font-bold tracking-wider">POS</span>
    </div>
  </div>

  <nav class="flex items-center gap-1">
    <a routerLink="/operador"
       routerLinkActive="bg-slate-900 text-white"
       [routerLinkActiveOptions]="{ exact: true }"
       class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all flex items-center gap-1 cursor-pointer">
      ⚡ Operador (Ventas)
    </a>

    <a routerLink="/admin/carta"
       routerLinkActive="bg-slate-900 text-white"
       [routerLinkActiveOptions]="{ exact: true }"
       class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all flex items-center gap-1 cursor-pointer">
      ⚙️ Configurar Carta
    </a>

    <a routerLink="/admin/dashboard"
       routerLinkActive="bg-slate-900 text-white"
       [routerLinkActiveOptions]="{ exact: true }"
       class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all flex items-center gap-1 cursor-pointer">
      📊 Dashboard en Vivo
    </a>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
